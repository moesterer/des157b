<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longevity</title>

    <!-- Normalize -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua&family=Licorice&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">



</head>

<body>


    <section id="intro">
        <h1>longevity</h1>
        <button id="start-btn">click to start</button>
    </section>

    <main id="timeline">

        <section class="news-section first-news">
            <div 
                class="year year-left" 
                data-aos="fade-right" 
                data-aos-anchor-placement="center-bottom"
            >
                2012
            </div>

            <img 
                src="images/news2012.png" 
                alt="Newspaper article from 2012" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>

        <section class="news-section with-bkg">
            <img 
                src="images/bkg2026.png" 
                alt="" 
                class="bkg-img move-left"
            >
                
            <div 
                class="year year-right" 
                data-aos="fade-left" 
                data-aos-anchor-placement="center-bottom"
            >
                2026
            </div>
        
            <img 
                src="images/news2026.png" 
                alt="Newspaper article from 2026" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>
        
        <section class="news-section">
            <div 
                class="year year-left dark-year" 
                data-aos="fade-right" 
                data-aos-anchor-placement="center-bottom"
            >
                2036
            </div>
        
            <img 
                src="images/news2036.png" 
                alt="Newspaper article from 2036" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>

        <section class="news-section with-bkg">
            <img 
                src="images/bkg2051.png" 
                alt="" 
                class="bkg-img move-right"
            >

            <div 
                class="year year-right light-year" 
                data-aos="fade-left" 
                data-aos-anchor-placement="center-bottom"
            >
                2051
            </div>

            <img 
                src="images/news2051.png" 
                alt="Newspaper article from 2051" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>

        <section class="news-section">
            <div 
                class="year year-left light-year" 
                data-aos="fade-right" 
                data-aos-anchor-placement="center-bottom"
            >
                2073
            </div>

            <img 
                src="images/news2073.png" 
                alt="Newspaper article from 2073" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>

        <section class="news-section with-bkg final-news">
            <img 
                src="images/bkg2129.png" 
                alt="" 
                class="bkg-img move-left"
            >

            <div 
                class="year year-right light-year" 
                data-aos="fade-left" 
                data-aos-anchor-placement="center-bottom"
            >
                2129
            </div>

            <img 
                src="images/news2129.png" 
                alt="Newspaper article from 2129" 
                class="news-img"
                data-aos="fade-up"
                data-aos-anchor-placement="center-bottom"
            >
        </section>

        <section id="ending">
            <h2 
                data-aos="fade-up" 
                data-aos-anchor-placement="center-bottom"
            >
                Today is May 19, 2129
            </h2>
        </section>

    </main>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="script.js"></script>



</body>
</html>
